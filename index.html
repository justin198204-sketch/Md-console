<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MD Dashboard"/>
<meta name="theme-color" content="#0B1220"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icons/icon.svg"/>
<title>MD Dashboard V1.1</title>
<style>
:root{--bg:#070B14;--card:#121A2B;--card2:#1A2438;--line:#243049;--text:#F3F4F6;--muted:#9CA3AF;--blue:#3B82F6;--green:#22C55E;--amber:#F59E0B;--blue:#3B82F6;
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100%}
body{padding:calc(10px + var(--safe-t)) 12px calc(96px + var(--safe-b))}
header{position:sticky;top:0;z-index:5;padding:6px 2px 10px;background:linear-gradient(180deg,rgba(7,11,20,.98),rgba(7,11,20,.85) 80%,transparent)}
.h1{font-size:22px;font-weight:800;margin:0}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
.tabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto}
.tab{flex:1;min-width:56px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:10px 0;font-size:13px;font-weight:700}
.tab.on{background:#1E3A8A;border-color:#2563EB;color:#fff}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.sec{font-size:12px;font-weight:700;color:var(--muted);margin:14px 2px 6px;display:flex;justify-content:space-between}
.item{padding:14px;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.title{font-size:15px;font-weight:700;line-height:1.35}
.ctx{margin-top:8px;font-size:13px;line-height:1.5;color:#D1D5DB;white-space:pre-wrap}
.note{margin-top:10px;padding:10px 12px;border-radius:12px;background:#0B1220;border:1px solid #334155}
.note-label{font-size:11px;font-weight:800;color:var(--amber);margin-bottom:4px}
.note-body{font-size:12px;line-height:1.45;color:#E5E7EB}
.note-meta{margin-top:6px;font-size:11px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#1F2937;color:var(--muted)}
.tag.ksl{background:#172554;color:#93C5FD}.tag.rp{background:#3B0764;color:#E9D5FF}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:12px;text-align:left;font-size:14px;font-weight:600}
.opt.on{background:#14532D;border-color:#22C55E}
.other-box{display:none;margin-top:8px}.other-box.show{display:block}
.field{width:100%;border:1px solid var(--line);background:#0B1220;color:var(--text);border-radius:12px;padding:12px;font-size:14px}
.row{display:flex;gap:10px;align-items:flex-start}
.check{width:22px;height:22px;border-radius:7px;border:2px solid #6B7280;flex:0 0 auto;margin-top:1px;display:grid;place-items:center}
.done .check{background:var(--green);border-color:var(--green)}.done .check::after{content:"✓";color:#052e16;font-weight:800;font-size:12px}
.done .title{opacity:.45;text-decoration:line-through}
.qhead{padding:12px 14px 0;font-size:14px;font-weight:800}
.empty{padding:14px;color:var(--muted);font-size:14px}
.when{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:4px}
.hint{color:var(--muted);font-size:12px;line-height:1.45;margin:8px 2px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + var(--safe-b));background:rgba(7,11,20,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;background:var(--card2);color:var(--text);font-weight:700;font-size:13px}
.btn.primary{background:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);background:#111827;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
.summary{padding:12px 14px;font-size:13px;color:var(--muted)}.summary b{color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="h1" id="h1">MD Dashboard V1.1</div>
  <div class="sub" id="sub">加载中…</div>
  <div class="tabs" id="lineFilters">
    <button class="tab on" data-line="全部" type="button">全部</button>
    <button class="tab" data-line="KSL" type="button">KSL</button>
    <button class="tab" data-line="Richpeace" type="button">Richpeace</button>
  </div>
  <div class="tabs" id="panelTabs">
    <button class="tab on" data-p="decide" type="button">拍板</button>
    <button class="tab" data-p="todo" type="button">待办</button>
    <button class="tab" data-p="cal" type="button">日程</button>
    <button class="tab" data-p="set" type="button">设置</button>
  </div>
</header>
<section class="panel on" id="p-decide"></section>
<section class="panel" id="p-todo"></section>
<section class="panel" id="p-cal"></section>
<section class="panel" id="p-set">
  <div class="sec"><span>同步到幕僚长</span></div>
  <div class="card item">
    <div class="title">同步代理（推荐）</div>
    <p class="hint">填 Cloudflare Worker 地址，形如 https://xxx.workers.dev 。密钥只放 Cloudflare，不要贴 Webhook 到这里。</p>
    <input class="field" id="proxyUrl" type="url" placeholder="https://md-board-proxy.…workers.dev" autocomplete="off"/>
    <div class="title" style="margin-top:14px">直连 Webhook（不推荐，手机常失败）</div>
    <p class="hint">备用。例行任务入口：[Webhook URL](grokbot://app/v1/sidebar?target=webhook-url&automation=md)</p>
    <input class="field" id="webhookUrl" type="url" placeholder="https://… webhook …" autocomplete="off"/>
    <button class="btn primary" id="btnSaveHook" type="button" style="margin-top:10px;width:100%">保存</button>
  </div>
</section>
<div class="bar">
  <button class="btn" id="btnClear" type="button">清除选择</button>
  <button class="btn primary" id="btnSubmit" type="button">提交拍板</button>
</div>
<div class="toast" id="toast"></div>
<script>
const DATA = {"date": "2026-09-21", "title": "MD Dashboard V1.1", "updatedAt": "2026-09-21T07:49:00+08:00", "lines": ["全部", "KSL", "Richpeace"], "decisions": [{"id": "d1", "text": "PSR Bangert：今天是否仍按模板补交？", "context": "Melanie Bangert 9/2《KSL - PSR-Daten》要求最迟 9/14 10:00 提交 PSR（Finance/Development/Project Status/Sales），附件 Vorlage_PSR.pptx。至今未见提交。9/20 拍板周一补交；今天周一，需确认是否仍今天交、改期或他人代交你审签。", "source": "邮件", "line": "KSL", "note": "昨夜选过 A 周一补交；今日需再确认执行方式", "noteSource": "KSL秘书扫描", "noteAt": "2026-09-21 07:49 +08", "options": ["A 今天按模板补交", "B 改期到周三前并告知", "C 指定他人代交你审签", "D 其他…"]}, {"id": "d2", "text": "9/23 股东会材料：今日会如何对齐？", "context": "9/23 股东会临近。Patrick 按6月格式更新股东会/PSR数据未见确认；Frank 新幻灯片待对齐。今天 11:00 Management Meeting KSL（2.OG，Frank）。", "source": "Teams", "line": "KSL", "note": "待拍板", "noteSource": "KSL秘书扫描", "noteAt": "2026-09-21 07:49 +08", "options": ["A 会上对齐并催Patrick", "B 会后约、最迟明天交齐", "C 先开会、材料周三前再说", "D 其他…"]}, {"id": "d3", "text": "Forvia/Yanis：是否改催书面放行？", "context": "CILLA/Yanis/Laura 9/19 Forvia 账户：缺已完成服务 PO，设备 557-00004、562-00018，服务发货暂停；CILLA 称据悉已放行仍需核实。9/20 曾拍搁置；今天是否改催书面放行。", "source": "邮件", "line": "KSL", "note": "昨夜选 C 搁置；今日是否改口", "noteSource": "KSL秘书扫描", "noteAt": "2026-09-21 07:49 +08", "options": ["A 今天催最终核实+书面放行", "B 继续搁置", "C 关闭跟进", "D 其他…"]}, {"id": "r1", "text": "Richpeace 三条跟进口径何时重启？", "context": "多针细节、Adient 精度风险、Morocco 直订/售后。出差前搁置不外发。exmail 掉线，未回复待登录后补扫。", "source": "交接/邮件", "line": "Richpeace", "note": "已选 C 继续搁置；可改。", "noteSource": "Justin 拍板", "noteAt": "2026-09-20 02:26 +08", "options": ["A 回来立刻重启", "B 指定日期再议", "C 继续搁置", "D 其他…"], "chosen": "C"}, {"id": "r2", "text": "exmail 重登以便补扫未回复", "context": "网页会话超时，停在 https://exmail.qq.com/login（企业微信扫码）。未扫收件箱与备份夹。需 Justin 登录后才能补扫对方在等回复/需拍板事项。", "source": "系统", "line": "Richpeace", "options": ["A 现在扫码登录", "B 今晚再登", "C 先搁置", "D 其他…"], "note": "待拍板", "noteSource": "Richpeace秘书", "noteAt": "2026-09-21 07:08 +08"}], "quadrants": {"iu": [{"id": "q1", "text": "PSR Bangert 补交（周一包）", "source": "邮件", "line": "KSL", "context": "昨夜拍 A 周一补交；今日需确认是否仍执行/改期/代交。"}, {"id": "q2", "text": "今日 11:00 Management｜对齐 Frank 幻灯片", "source": "日历", "line": "KSL"}, {"id": "q3", "text": "催 Patrick：9/23 股东会+PSR 数据", "source": "Teams", "line": "KSL"}], "inu": [{"id": "q4", "text": "Forvia/Yanis PO 放行｜557-00004、562-00018", "source": "邮件", "line": "KSL", "note": "昨夜搁置，今日再确认"}, {"id": "q5", "text": "Guido Marketing+R&D slides 未见确认", "source": "Teams", "line": "KSL"}, {"id": "q6", "text": "Joachim 搬迁档期 — 出差后再说", "source": "邮件", "line": "KSL", "note": "已选出差后"}, {"id": "q7", "text": "Dominik CW38 周报未见闭环", "source": "邮件", "line": "KSL"}, {"id": "rinu1", "text": "多针口径（Ida）", "context": "缺 Justin 侧技术细节；双锁式+多针近 LR15 非标配。出差前搁置不外发。", "note": "出差后再说；不外发", "source": "邮件", "line": "Richpeace"}, {"id": "rinu2", "text": "Adient 自动化上下料/精度风险", "context": "定位约±1mm、切割约±3mm，场地约5.5×6.5m，产量约7000/16h；Ida 评精度风险高。出差前搁置不外发。", "note": "出差后再说；不外发", "source": "邮件 Ida", "line": "Richpeace"}, {"id": "rinu3", "text": "Morocco 刺绣/CNC 报价", "context": "4头600×700、4台约€121,640；含选项服务夹具约€164,140。Ida 倾向 Adient 直订 Richpeace。出差前搁置不外发。", "note": "出差后再说；不外发", "source": "邮件 Ida", "line": "Richpeace"}, {"id": "rinu4", "text": "exmail 未回复补扫：待 Justin 重登", "context": "掉线于 login 页；墨西哥 DA 已电话、Ida 自理，无需外发。", "note": "登录恢复后补扫", "source": "系统", "line": "Richpeace"}], "niu": [], "ninu": [{"id": "q8", "text": "Fritz/Saskia Umzug Büro（仅 CC，约 10/9）", "source": "邮件", "line": "KSL"}, {"id": "q9", "text": "ekom21 26.5214（已拍不做）", "source": "邮件", "line": "KSL", "done": true}, {"id": "q10", "text": "Patrick 8月财务/CPCONS（已搁置）", "source": "邮件", "line": "KSL"}, {"id": "q11", "text": "Joyce PI / Ida 墨西哥 DA（已拍知晓/自理）", "source": "邮件", "line": "KSL", "done": true}]}, "calendar": [{"id": "c1", "when": "今天 一 11:00–12:00", "text": "Management Meeting KSL", "where": "Besprechungsraum 2. OG", "who": "Frank Meyer 等", "line": "KSL"}, {"id": "c2", "when": "今天 一 13:30–14:30", "text": "Sales meeting", "where": "", "who": "", "line": "KSL"}, {"id": "c3", "when": "9/22–25", "text": "2026汉堡国际风能展（全天）", "where": "德国汉堡", "who": "", "line": "KSL"}, {"id": "c4", "when": "9/23 三 03:30–11:30", "text": "智能制造事业部产销研（百福上海、上工富怡）", "where": "注意时区", "who": "", "line": "KSL"}, {"id": "c5", "when": "9/28 一 11:00–12:00", "text": "Management Meeting KSL", "where": "Besprechungsraum 2. OG", "who": "Frank", "line": "KSL"}, {"id": "c6", "when": "9/28 一 13:30–14:30", "text": "Sales meeting", "where": "", "who": "", "line": "KSL"}, {"id": "c7", "when": "9/30 三 13:00–14:00", "text": "same girl friend of Guido", "where": "", "who": "", "line": "KSL"}], "scanNote": "KSL 9/21 07:49 Outlook+Teams 实扫；连接器未授权 | Richpeace: exmail offline, r2 open", "lastBoard": {"at": "2026-09-20 02:26 +08", "choices": "1c,2d,3d,4c,5c,6c,7a,8c", "via": "chat-paste", "detail": {"d4": "C 先搁置", "d5": "D 内容知晓，不做批复", "d6": "D 电话沟通，Ida自行处理", "d1": "C 出差后再说", "d2": "C 先搁置", "d3": "C 不做", "d7": "A 周一补交", "r1": "C 继续搁置"}}, "version": "1.1"};
const KEY_C='md-console-choices-v4', KEY_T='md-console-other-text-v4', KEY_D='md-console-done-v4', KEY_W='md-console-webhook-v1', KEY_P='md-console-proxy-v1';
let tab='decide', lineFilter='全部';
let data=DATA;
function passLine(it){return !it||lineFilter==='全部'||it.line===lineFilter;}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800)}
function loadC(){try{return JSON.parse(localStorage.getItem(KEY_C)||'{}')}catch{return{}}}
function saveC(m){localStorage.setItem(KEY_C,JSON.stringify(m))}
function loadT(){try{return JSON.parse(localStorage.getItem(KEY_T)||'{}')}catch{return{}}}
function saveT(m){localStorage.setItem(KEY_T,JSON.stringify(m))}
function loadD(){try{return JSON.parse(localStorage.getItem(KEY_D)||'{}')}catch{return{}}}
function saveD(m){localStorage.setItem(KEY_D,JSON.stringify(m))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function lineTag(l){return l==='KSL'?'ksl':'rp'}
function isOther(o){return /其他/.test(o)}
function letterAt(i){return String.fromCharCode(65+i)}
function otherLetter(d){const opts=d.options||[];for(let i=0;i<opts.length;i++) if(isOther(opts[i])) return letterAt(i); return null}
function labelFor(d,letter,otherText){
  const opts=d.options||[]; const idx=letter.charCodeAt(0)-65; const o=opts[idx]||letter;
  if(isOther(o)) return otherText?('其他：'+otherText):'其他（未填）';
  return o;
}
function summary(){
  const m=loadC(), t=loadT(), list=(data.decisions||[]).filter(d=>m[d.id]);
  if(!list.length) return '（未选择）';
  return list.map((d,i)=>{const L=m[d.id]; return (i+1)+String(L).toLowerCase()+'（'+labelFor(d,L,t[d.id]||'')+'）'}).join('；');
}
function renderDecide(){
  const box=document.getElementById('p-decide'); const m=loadC(); const tmap=loadT(); const list=(data.decisions||[]).filter(passLine);
  if(!list.length){box.innerHTML='<div class="card"><div class="empty">'+(lineFilter==='全部'?'今日无需拍板':lineFilter+' 线暂无拍板')+'</div></div>';return}
  box.innerHTML=`<div class="sec"><span>⚡ 拍板</span><span>${list.length}</span></div>`+list.map((d,i)=>{
    const cur=m[d.id]||''; const oLet=otherLetter(d);
    const opts=(d.options||[]).map((o,oi)=>{
      const letter=letterAt(oi);
      return `<button class="opt${cur===letter?' on':''}" data-id="${esc(d.id)}" data-letter="${letter}" data-other="${isOther(o)?'1':'0'}" type="button">${esc(o)}</button>`;
    }).join('');
    const showOther=!!(cur && oLet && cur===oLet);
    const note = d.note ? `<div class="note"><div class="note-label">备注</div><div class="note-body">${esc(d.note)}</div>
      <div class="note-meta">出处：${esc(d.noteSource||d.source||'—')} · 时间：${esc(d.noteAt||data.updatedAt||'—')}</div></div>` : '';
    const ctx = d.context ? `<div class="ctx">${esc(d.context)}</div>` : '';
    return `<div class="card item"><div class="title">${i+1}. ${esc(d.text)}</div>${ctx}
      <div class="meta"><span class="tag ${lineTag(d.line)}">${esc(d.line)}</span><span class="tag">${esc(d.source)}</span>
      ${d.updatedAt?`<span class="tag">更新 ${esc(d.updatedAt)}</span>`:''}</div>
      ${note}
      <div class="opts">${opts}</div>
      <div class="other-box${showOther?' show':''}" data-other-for="${esc(d.id)}">
        <input class="field" data-other-input="${esc(d.id)}" type="text" placeholder="请输入其他说明…" value="${esc(tmap[d.id]||'')}"/>
      </div></div>`;
  }).join('');
}
function renderTodo(){
  const box=document.getElementById('p-todo'); const done=loadD(); const q=data.quadrants||{};
  box.innerHTML=[['iu','🔴 重要且紧急'],['inu','🟠 重要不紧急'],['niu','🟡 不重要但紧急'],['ninu','⚪ 不重要不紧急']].map(([k,label])=>{
    const items=(q[k]||[]).filter(passLine);
    const body=items.length?items.map(it=>{
      const isDone=!!done[it.id]||!!it.done;
      return `<div class="item row${isDone?' done':''}" data-todo="${esc(it.id)}"><div class="check"></div><div><div class="title">${esc(it.text)}</div>
        <div class="meta"><span class="tag ${lineTag(it.line)}">${esc(it.line)}</span><span class="tag">${esc(it.source)}</span></div></div></div>`;
    }).join(''):`<div class="empty">无</div>`;
    return `<div class="card"><div class="qhead">${label}</div>${body}</div>`;
  }).join('');
}
function renderCal(){
  const box=document.getElementById('p-cal'); const list=(data.calendar||[]).filter(passLine);
  if(!list.length){box.innerHTML='<div class="card"><div class="empty">'+(lineFilter==='全部'?'近几日无日程':lineFilter+' 线暂无日程')+'</div></div>';return}
  box.innerHTML=`<div class="sec"><span>📅 近几日日程</span><span>${list.length}</span></div><div class="card">`+
    list.map(c=>`<div class="item"><div class="when">${esc(c.when)}</div><div class="title">${esc(c.text)}</div>
      <div class="meta">${c.where?`<span class="tag">${esc(c.where)}</span>`:''}${c.who?`<span class="tag">${esc(c.who)}</span>`:''}</div></div>`).join('')+`</div>`;
}
function render(){
  document.title='MD Dashboard V1.1';
  document.getElementById('h1').textContent=data.title||'MD Dashboard V1.1';
  document.getElementById('sub').textContent=`${data.date||''} · 数据更新 ${data.updatedAt||''}`;
  const lf=document.getElementById('lineFilters');
  if(lf){
    const lines=data.lines||['全部','KSL','Richpeace'];
    lf.innerHTML=lines.map(l=>`<button class="tab${lineFilter===l?' on':''}" data-line="${esc(l)}" type="button">${esc(l)}</button>`).join('');
  }
  const wh=document.getElementById('webhookUrl'); if(wh) wh.value=localStorage.getItem(KEY_W)||'';
  const px=document.getElementById('proxyUrl'); if(px) px.value=localStorage.getItem(KEY_P)||'';
  renderDecide(); renderTodo(); renderCal();
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+tab));
  document.querySelectorAll('#panelTabs .tab[data-p]').forEach(t=>t.classList.toggle('on',t.dataset.p===tab));
}
document.getElementById('panelTabs')?.addEventListener('click',e=>{
  const t=e.target.closest('button.tab[data-p]'); if(!t) return;
  tab=t.dataset.p; render();
});
document.body.addEventListener('click',e=>{
  const opt=e.target.closest('.opt');
  if(opt){
    const m=loadC(); m[opt.dataset.id]=opt.dataset.letter; saveC(m); render();
    if(opt.dataset.other==='1'){const inp=document.querySelector(`[data-other-input="${opt.dataset.id}"]`); if(inp) inp.focus()}
    toast('已选 '+opt.dataset.letter); return;
  }
  const todo=e.target.closest('[data-todo]');
  if(todo){const m=loadD(); const id=todo.dataset.todo; if(m[id]) delete m[id]; else m[id]=Date.now(); saveD(m); render()}
});
document.body.addEventListener('input',e=>{
  const inp=e.target.closest('[data-other-input]');
  if(!inp) return; const m=loadT(); m[inp.getAttribute('data-other-input')]=inp.value; saveT(m);
});
document.getElementById('btnSaveHook').onclick=()=>{const v=(document.getElementById('webhookUrl')||{}).value||''; const p=(document.getElementById('proxyUrl')||{}).value||''; localStorage.setItem(KEY_W,v.trim()); localStorage.setItem(KEY_P,p.trim()); toast((p.trim()||v.trim())?'已保存':'已清空')};
document.getElementById('btnClear').onclick=()=>{localStorage.removeItem(KEY_C); localStorage.removeItem(KEY_T); render(); toast('已清除')};
document.getElementById('btnSubmit').onclick=async()=>{
  const proxy=(localStorage.getItem(KEY_P)||'').trim();
  const hook=(localStorage.getItem(KEY_W)||'').trim();
  const m=loadC(), tmap=loadT(), list=data.decisions||[];
  if(list.some(d=>!m[d.id])){toast('还有未选项');return}
  for(const d of list){const ol=otherLetter(d); if(ol&&m[d.id]===ol&&!(tmap[d.id]||'').trim()){toast('请填写「其他」');return}}
  const payload={source:'md-console',date:data.date,summary:summary(),compact:list.map((d,i)=>`${i+1}${m[d.id].toLowerCase()}`).join(','),
    decisions:list.map((d,i)=>({n:i+1,id:d.id,text:d.text,context:d.context||'',choice:m[d.id],label:labelFor(d,m[d.id],tmap[d.id]||''),otherText:otherLetter(d)===m[d.id]?(tmap[d.id]||''):'',note:d.note||'',noteSource:d.noteSource||'',noteAt:d.noteAt||'',line:d.line||''}))};
  const body=JSON.stringify(payload);
  let copied=false;
  try{await navigator.clipboard.writeText(payload.summary); copied=true}catch(e){
    try{const ta=document.createElement('textarea'); ta.value=payload.summary; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); copied=document.execCommand('copy'); document.body.removeChild(ta);}catch{}
  }
  const target=proxy||hook;
  if(!target){
    toast(copied?'未配置同步地址，摘要已复制，请粘贴给幕僚长':'请配置同步代理或粘贴摘要');
    tab='set'; render(); return;
  }
  if(proxy){
    try{
      const r=await fetch(proxy,{method:'POST',headers:{'Content-Type':'application/json'},body,mode:'cors'});
      const j=await r.json().catch(()=>({}));
      if(r.ok && j.ok!==false){toast('已同步给幕僚长'); return;}
      toast(copied?'同步失败，摘要已复制，请粘贴给幕僚长':'同步失败，请检查 Worker');
      return;
    }catch(e){
      toast(copied?'同步失败，摘要已复制，请粘贴给幕僚长':'同步失败');
      return;
    }
  }
  // legacy direct webhook best-effort
  try{ navigator.sendBeacon && navigator.sendBeacon(hook, body); }catch{}
  try{ fetch(hook,{method:'POST',mode:'no-cors',body,keepalive:true}); }catch{}
  toast(copied?'直连不稳定，摘要已复制，请粘贴确认':'请粘贴摘要给幕僚长');
};
document.getElementById('lineFilters')?.addEventListener('click',e=>{
  const b=e.target.closest('[data-line]'); if(!b) return;
  lineFilter=b.dataset.line||'全部';
  render();
});
render();
</script>
</body>
</html>
